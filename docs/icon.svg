<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="shell">
      <rect x="100" y="100" width="824" height="824" rx="192" ry="192"/>
    </clipPath>
    <linearGradient id="dark" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#34383F"/>
      <stop offset="0.55" stop-color="#23262B"/>
      <stop offset="1" stop-color="#191B1E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#shell)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dark)"/>

    <!-- X mark: two-tone -->
    <path d="M347 302 L677 622" stroke="#E9EBEF" stroke-width="88" stroke-linecap="round" fill="none"/>
    <path d="M347 622 L677 302" stroke="url(#accent)" stroke-width="88" stroke-linecap="round" fill="none"/>
    <!-- cursor -->
    <rect x="397" y="690" width="230" height="56" rx="28" fill="#E9EBEF"/>
  </g>
</svg>
